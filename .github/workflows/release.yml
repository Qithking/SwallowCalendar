name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PRODUCT_BUNDLE_IDENTIFIER: com.swallowcalendar.app
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show Xcode and SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --show-sdk-path

      - name: Build Universal Binary
        run: |
          mkdir -p build

          # 构建 arm64 版本
          xcodebuild build \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar \
            -configuration Release \
            -arch arm64 \
            -sdk macosx \
            -derivedDataPath build/DerivedData-arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          ARM64_APP=$(find build/DerivedData-arm64 -name "SwallowCalendar.app" -type d | head -1)
          ARM64_BIN="$ARM64_APP/Contents/MacOS/SwallowCalendar"

          if [ ! -f "$ARM64_BIN" ]; then
            echo "Error: arm64 binary not found"
            exit 1
          fi

          cp "$ARM64_BIN" build/SwallowCalendar-arm64
          echo "arm64 binary: $ARM64_BIN"

          # 构建 x86_64 版本
          xcodebuild clean \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar

          xcodebuild build \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar \
            -configuration Release \
            -arch x86_64 \
            -sdk macosx \
            -derivedDataPath build/DerivedData-x86 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          X86_APP=$(find build/DerivedData-x86 -name "SwallowCalendar.app" -type d | head -1)
          X86_BIN="$X86_APP/Contents/MacOS/SwallowCalendar"

          if [ ! -f "$X86_BIN" ]; then
            echo "Error: x86_64 binary not found"
            exit 1
          fi

          cp "$X86_BIN" build/SwallowCalendar-x86_64
          echo "x86_64 binary: $X86_BIN"

          # 合并为 Universal Binary
          lipo -create build/SwallowCalendar-arm64 build/SwallowCalendar-x86_64 -output build/SwallowCalendar

          echo "=== Universal Binary Info ==="
          lipo -info build/SwallowCalendar

      - name: Create App Bundle from xcodebuild output
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BUILD_NUM=$(git rev-list HEAD --count)

          # 使用 arm64 构建的 .app 作为基础（包含完整的 Info.plist、图标、资源）
          BASE_APP=$(find build/DerivedData-arm64 -name "SwallowCalendar.app" -type d | head -1)

          # 复制 .app 目录
          cp -R "$BASE_APP" SwallowCalendar.app

          # 用 Universal Binary 替换二进制
          cp build/SwallowCalendar SwallowCalendar.app/Contents/MacOS/SwallowCalendar

          # 更新 Info.plist 中的版本号
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" SwallowCalendar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" SwallowCalendar.app/Contents/Info.plist

          echo "=== App Bundle Structure ==="
          ls -la SwallowCalendar.app/Contents/MacOS/
          cat SwallowCalendar.app/Contents/Info.plist

      - name: Ad-hoc Sign App
        run: |
          # 使用 ad-hoc 签名
          codesign --force --deep --sign "-" SwallowCalendar.app

          echo "=== Verify Signature ==="
          codesign -vvv SwallowCalendar.app || true
          spctl --assess --type exec --verbose=2 SwallowCalendar.app 2>&1 || true

      - name: Create DMG
        run: |
          brew install create-dmg

          mkdir -p dmg_temp
          cp -R SwallowCalendar.app dmg_temp/

          # 使用 .icns 作为 DMG 卷图标
          ICON_PATH="dmg_temp/SwallowCalendar.app/Contents/Resources/AppIcon.icns"

          echo "=== Using icon: $ICON_PATH ==="

          # 创建 DMG
          create-dmg \
            --volname "SwallowCalendar" \
            --window-pos 200 120 \
            --window-size 500 350 \
            --icon "SwallowCalendar.app" 150 175 \
            --app-drop-link 350 175 \
            --hide-extension "SwallowCalendar.app" \
            --volicon "$ICON_PATH" \
            "SwallowCalendar-${{ github.ref_name }}-universal.dmg" \
            "dmg_temp/"

          ls -la *.dmg

      - name: Generate Release Body
        id: release_body
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --oneline --format='  - %s' 2>/dev/null | head -50 || echo "  - 无更新内容")
          else
            CHANGELOG=$(git log --oneline --format='  - %s' | head -20 2>/dev/null || echo "  - 无更新内容")
          fi

          {
            echo "### 更新内容"
            echo "$CHANGELOG"
            echo ""
            echo "### 安装说明"
            echo "  1. 下载并打开 DMG 文件"
            echo "  2. 将 SwallowCalendar.app 拖入 Applications 文件夹"
            echo "  3. 如果提示"无法打开"，请在系统设置 > 隐私与安全性中允许运行"
            echo "  4. 应用启动时需要访问日历和系统提醒应用权限（如果有数据同步异常问题请检查是否有相关权限）"
            echo ""
            echo "### 系统要求"
            echo "  - macOS 14.0 (Sonoma) 或更高版本"
          } > release_body.txt

          cat release_body.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.txt
          files: SwallowCalendar-*.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwallowCalendar-build
          path: |
            SwallowCalendar.app
            SwallowCalendar-*.dmg
          retention-days: 7
