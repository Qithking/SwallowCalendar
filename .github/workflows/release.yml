name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  PRODUCT_BUNDLE_IDENTIFIER: com.swallowcalendar.app
  MACOSX_DEPLOYMENT_TARGET: "14.0"
  # S-3：是否配置了 Developer ID 证书（存在时走真签名+公证，否则走硬化 ad-hoc）
  HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_P12 != '' }}

jobs:
  build:
    name: release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show Xcode and SDK Info
        run: |
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --show-sdk-path

      - name: Build Universal Binary
        run: |
          mkdir -p build

          # 构建 arm64 版本
          xcodebuild build \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar \
            -configuration Release \
            -arch arm64 \
            -sdk macosx \
            -derivedDataPath build/DerivedData-arm64 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          ARM64_APP=$(find build/DerivedData-arm64 -name "SwallowCalendar.app" -type d | head -1)
          ARM64_BIN="$ARM64_APP/Contents/MacOS/SwallowCalendar"

          if [ ! -f "$ARM64_BIN" ]; then
            echo "Error: arm64 binary not found"
            exit 1
          fi

          cp "$ARM64_BIN" build/SwallowCalendar-arm64
          echo "arm64 binary: $ARM64_BIN"

          # 构建 x86_64 版本
          xcodebuild clean \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar

          xcodebuild build \
            -project SwallowCalendar.xcodeproj \
            -scheme SwallowCalendar \
            -configuration Release \
            -arch x86_64 \
            -sdk macosx \
            -derivedDataPath build/DerivedData-x86 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          X86_APP=$(find build/DerivedData-x86 -name "SwallowCalendar.app" -type d | head -1)
          X86_BIN="$X86_APP/Contents/MacOS/SwallowCalendar"

          if [ ! -f "$X86_BIN" ]; then
            echo "Error: x86_64 binary not found"
            exit 1
          fi

          cp "$X86_BIN" build/SwallowCalendar-x86_64
          echo "x86_64 binary: $X86_BIN"

          # 合并为 Universal Binary
          lipo -create build/SwallowCalendar-arm64 build/SwallowCalendar-x86_64 -output build/SwallowCalendar

          echo "=== Universal Binary Info ==="
          lipo -info build/SwallowCalendar

      - name: Create App Bundle from xcodebuild output
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          BUILD_NUM=$(git rev-list HEAD --count)

          # 使用 arm64 构建的 .app 作为基础（包含完整的 Info.plist、图标、资源）
          BASE_APP=$(find build/DerivedData-arm64 -name "SwallowCalendar.app" -type d | head -1)

          # 复制 .app 目录
          cp -R "$BASE_APP" SwallowCalendar.app

          # 用 Universal Binary 替换二进制
          cp build/SwallowCalendar SwallowCalendar.app/Contents/MacOS/SwallowCalendar

          # 更新 Info.plist 中的版本号
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" SwallowCalendar.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" SwallowCalendar.app/Contents/Info.plist

          echo "=== App Bundle Structure ==="
          ls -la SwallowCalendar.app/Contents/MacOS/
          cat SwallowCalendar.app/Contents/Info.plist

      - name: Import Developer ID Certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # S-3：将 base64 的 p12 证书导入临时 keychain（CI 无 GUI，需允许 codesign 无交互访问）
          CERT_DIR=$(mktemp -d)
          KEYCHAIN="$CERT_DIR/build.keychain-db"
          KEYCHAIN_PASS=$(openssl rand -hex 24)
          echo -n "$DEVELOPER_ID_P12" | base64 --decode -o "$CERT_DIR/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security import "$CERT_DIR/cert.p12" -k "$KEYCHAIN" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"

          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASS=$KEYCHAIN_PASS" >> "$GITHUB_ENV"

      - name: Sign App
        env:
          # 签名身份（默认 Developer ID Application，可在 secrets 覆盖）
          SIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_NAME || 'Developer ID Application' }}
        run: |
          # S-3：签名统一启用 hardened runtime 并嵌入 entitlements，与本地构建配置一致
          ENTITLEMENTS="SwallowCalendar/SwallowCalendar.entitlements"

          if [ "$HAS_DEVELOPER_ID" = "true" ]; then
            # Developer ID 签名（带时间戳，可通过 Gatekeeper）
            codesign --force --deep --options runtime \
              --entitlements "$ENTITLEMENTS" \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGN_IDENTITY" --timestamp \
              SwallowCalendar.app
          else
            # 未配置证书：硬化 ad-hoc 签名（启用 runtime 缓解注入类攻击）
            codesign --force --deep --options runtime \
              --entitlements "$ENTITLEMENTS" \
              --sign "-" \
              SwallowCalendar.app
          fi

          echo "=== Verify Signature ==="
          codesign -vvv --deep SwallowCalendar.app || true
          spctl --assess --type exec --verbose=2 SwallowCalendar.app 2>&1 || true

      - name: Create DMG
        run: |
          brew install create-dmg

          mkdir -p dmg_temp
          cp -R SwallowCalendar.app dmg_temp/

          # 使用 .icns 作为 DMG 卷图标
          ICON_PATH="dmg_temp/SwallowCalendar.app/Contents/Resources/AppIcon.icns"

          echo "=== Using icon: $ICON_PATH ==="

          # 创建 DMG
          create-dmg \
            --volname "SwallowCalendar" \
            --window-pos 200 120 \
            --window-size 500 350 \
            --icon "SwallowCalendar.app" 150 175 \
            --app-drop-link 350 175 \
            --hide-extension "SwallowCalendar.app" \
            --volicon "$ICON_PATH" \
            "SwallowCalendar-${{ github.ref_name }}-universal.dmg" \
            "dmg_temp/"

          ls -la *.dmg

      - name: Notarize and Staple DMG
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # S-3：公证 DMG 并装订票据（需在仓库 secrets 配置 Apple 账号与专用密码）
          DMG_FILE=$(ls SwallowCalendar-*.dmg | head -1)

          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait

          xcrun stapler staple "$DMG_FILE"
          xcrun stapler validate "$DMG_FILE"

      - name: Generate SHA256 Checksums
        run: |
          # S-1 配套：为每个 DMG 生成 ".sha256" 旁文件，作为客户端在线校验的 fallback 参照值
          for f in SwallowCalendar-*.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
            cat "$f.sha256"
          done

      - name: Generate Release Body
        id: release_body
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --oneline --format='  - %s' 2>/dev/null | head -50 || echo "  - 无更新内容")
          else
            CHANGELOG=$(git log --oneline --format='  - %s' | head -20 2>/dev/null || echo "  - 无更新内容")
          fi

          {
            echo "### 更新内容"
            echo "$CHANGELOG"
            echo ""
            echo "### 安装说明"
            echo "  1. 下载并打开 DMG 文件"
            echo "  2. 将 SwallowCalendar.app 拖入 Applications 文件夹"
            echo "  3. 如果提示"无法打开"，请在系统设置 > 隐私与安全性中允许运行"
            echo "  4. 应用启动时需要访问日历和系统提醒应用权限（如果有数据同步异常问题请检查是否有相关权限）"
            echo ""
            echo "### 系统要求"
            echo "  - macOS 14.0 (Sonoma) 或更高版本"
          } > release_body.txt

          cat release_body.txt

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.txt
          files: |
            SwallowCalendar-*.dmg
            SwallowCalendar-*.dmg.sha256
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SwallowCalendar-build
          path: |
            SwallowCalendar.app
            SwallowCalendar-*.dmg
          retention-days: 7
