name: test

on:
  push:
    branches:
      - main
      - Beta
  pull_request:
    branches:
      - main
      - Beta
  workflow_dispatch:

jobs:
  test:
    name: swift test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show Xcode and Swift Info
        run: |
          xcodebuild -version
          swift --version

      - name: Run Tests
        run: swift test
